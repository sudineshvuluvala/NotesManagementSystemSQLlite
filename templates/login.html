{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h4 text-center mb-4">Login</h1>
    <form method="post" novalidate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="identity">Username or Email</label>
        <input class="form-control" id="identity" name="identity" autocomplete="username" required autofocus>
      </div>
      <div class="mb-2">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="text-end mb-3"><a href="{{ url_for('forgot_password') }}" class="small">Forgot password?</a></div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="small text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}

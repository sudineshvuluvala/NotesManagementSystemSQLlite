{% extends "base.html" %}
{% block title %}{{ 'Add Note' if mode == 'add' else 'Update Note' }}{% endblock %}
{% block content %}
<div class="note-form-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h4 mb-4">{{ 'Add Note' if mode == 'add' else 'Edit Note' }}</h1>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" maxlength="150" value="{{ note.title if note else '' }}" placeholder="Enter note title" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="content">Content</label><textarea class="form-control" id="content" name="content" rows="6" placeholder="Write your note here..." required>{{ note.content if note else '' }}</textarea></div>
      <button class="btn btn-primary" type="submit">{{ 'Save Note' if mode == 'add' else 'Update' }}</button>
      <a class="btn btn-secondary" href="{{ url_for('view_all') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

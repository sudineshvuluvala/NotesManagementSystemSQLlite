{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h4 text-center mb-2">Create Account</h1>
    <p class="text-secondary text-center small mb-4">Register to start organizing your notes.</p>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" maxlength="100" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="100" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><div class="form-text">Use at least 8 characters.</div></div>
      <div class="mb-4"><label class="form-label" for="confirm_password">Confirm Password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="small text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}

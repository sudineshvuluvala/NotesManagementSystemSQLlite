{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4 p-md-5">
  <h1 class="h4 text-center mb-2">Forgot Password</h1><p class="small text-secondary text-center mb-4">Enter your registered email and we'll send reset instructions if your account exists.</p>
  <form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-4"><label class="form-label" for="email">Email Address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><button class="btn btn-primary w-100" type="submit">Send Reset Link</button></form>
  <p class="small text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Back to login</a></p>
</div></div>
{% endblock %}

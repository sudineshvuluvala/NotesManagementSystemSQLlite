{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4 p-md-5">
  <h1 class="h4 text-center mb-2">Choose a New Password</h1><p class="small text-secondary text-center mb-4">The password must be at least 8 characters long.</p>
  <form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="password">New Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="mb-4"><label class="form-label" for="confirm_password">Confirm New Password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-100" type="submit">Reset Password</button></form>
</div></div>
{% endblock %}
